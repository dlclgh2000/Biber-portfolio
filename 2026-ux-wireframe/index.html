<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sendbird delight.ai Prototype</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <script>
        // Pre-define Tailwind config BEFORE the CDN loads so that the first compile pass
        // picks up custom colors/fontFamily. Without this, http:// contexts (GitHub Pages,
        // VS Code Live Server) compile classes with default config and custom utilities
        // like `bg-sb-primary` are silently dropped.
        window.tailwind = {
            config: {
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', 'sans-serif'],
                        },
                        colors: {
                            sb: {
                                base: '#fafafa',
                                surface: '#ffffff',
                                border: '#e4e4e7',
                                primary: '#18181b',
                                primaryDark: '#09090b',
                                text: '#09090b',
                                muted: '#71717a',
                                hover: '#f4f4f5',
                            }
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .skeleton-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .dropdown-enter { animation: dropdownEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes dropdownEnter { from { opacity: 0; transform: translateY(-5px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-enter { animation: modalEnter 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalEnter { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-sb-base text-sb-text font-sans antialiased h-screen flex flex-col overflow-hidden" onclick="closeAllDropdowns(event)">

<script>
const state = {
    view: 'lobby',
    previousView: null,
    organization: 'Sendbird Inc.',
    workspaces: [
        { id: 'ws-a', name: 'Workspace A', agents: [
            {id: 'ag-4', name: 'Sales Bot', time: '10m ago', envStatus: {dev: 'v1.4.0', staging: 'v1.3.2', production: 'v1.3.0'}},
            {id: 'ag-1', name: 'AI Agent 1', time: '2h ago', envStatus: {dev: 'v0.9.1', staging: 'v0.9.0', production: null}},
            {id: 'ag-7', name: 'Marketing Bot', time: '1d ago', envStatus: {dev: 'v2.0.0', staging: 'v2.0.0', production: 'v1.9.8'}},
            {id: 'ag-2', name: 'AI Agent 2', time: '3d ago', envStatus: {dev: 'v1.0.0', staging: null, production: null}},
            {id: 'ag-3', name: 'AI Agent 3', time: '1w ago', envStatus: {dev: 'v1.1.0', staging: 'v1.1.0', production: 'v1.1.0'}},
            {id: 'ag-5', name: 'Support Bot', time: '1w ago', envStatus: {dev: 'v3.2.0', staging: 'v3.2.0', production: 'v3.2.0'}},
            {id: 'ag-6', name: 'HR Bot', time: '2w ago', envStatus: {dev: 'v1.0.1', staging: 'v1.0.0', production: 'v1.0.0'}}
        ] },
        { id: 'ws-b', name: 'Workspace B', agents: [
            {id: 'ag-b1', name: 'Global CS Bot', time: '5m ago', envStatus: {dev: 'v2.1.0', staging: 'v2.0.5', production: 'v2.0.0'}},
            {id: 'ag-b2', name: 'Billing Bot', time: '1h ago', envStatus: {dev: 'v1.0.0', staging: null, production: null}}
        ] },
        { id: 'ws-c', name: 'Workspace C', agents: [
            {id: 'ag-c1', name: 'Internal Wiki Bot', time: 'Just now', envStatus: {dev: 'v0.1.0', staging: null, production: null}}
        ] },
        { id: 'ws-d', name: 'Workspace D', agents: [] },
        { id: 'ws-e', name: 'Workspace E', agents: [] },
    ],
    currentWorkspaceId: null,
    currentAgentId: null,
    currentEnv: 'development',
    currentMenu: 'overview',
    orgSettingsMenu: 'general',
    wsSettingsMenu: 'general',
    modal: null,
    isWorkspaceDropdownOpen: false,
    isAgentMenuOpen: false
};

const menus = [
    { id: 'overview', label: 'Overview', icon: 'ph-squares-four' },
    { id: 'build', label: 'Build', icon: 'ph-hammer' },
    { id: 'test', label: 'Test', icon: 'ph-chat-circle-dots' },
    { id: 'evaluate', label: 'Evaluate', icon: 'ph-chart-line-up' }
];

const environments = {
    'development': { id: 'development', label: 'Dev', icon: 'ph-code', nextLabel: 'Staging', badgeColor: 'bg-white text-slate-800 border-slate-200' },
    'staging': { id: 'staging', label: 'Staging', icon: 'ph-flask', nextLabel: 'Prod', badgeColor: 'bg-amber-50 text-amber-800 border-amber-200' },
    'production': { id: 'production', label: 'Prod', icon: 'ph-rocket-launch', nextLabel: null, badgeColor: 'bg-green-50 text-green-700 border-green-200 shadow-sm' }
};

const orgSettingsMenus = [
    { id: 'general', label: 'General', icon: 'ph-buildings', section: 'organization', desc: '조직 이름, 구독 플랜, 보안 컴플라이언스 등 기본 설정' },
    { id: 'members', label: 'Members', icon: 'ph-users', section: 'organization', desc: '팀 멤버 관리, 초대, 권한 부여' },
    { id: 'roles', label: 'Roles', icon: 'ph-shield-check', section: 'organization', desc: '역할 기반 접근 제어(RBAC) 설정' },
    { id: 'security', label: 'Security', icon: 'ph-lock-key', section: 'organization', desc: '2FA 강제, 로그인 IP 제한, SAML SSO, Support 접근 설정' },
    { id: 'billing', label: 'Billing', icon: 'ph-credit-card', section: 'organization', desc: '구독 및 결제 관리' },
    { id: 'profile', label: 'Profile', icon: 'ph-user-circle', section: 'account', desc: '로그인한 멤버의 개인정보 관리' }
];

const wsSettingsMenus = [
    { id: 'general', label: 'General', icon: 'ph-gear', desc: '워크스페이스 기본 설정' },
    { id: 'users', label: 'Users', icon: 'ph-users-three', desc: '사용자 계정 및 권한 관리' },
    { id: 'shared-assets', label: 'Shared Assets', icon: 'ph-stack', desc: '여러 에이전트가 공유하는 자산 모음' },
    { id: 'integrations', label: 'Integrations', icon: 'ph-plugs', desc: '외부 서비스 연동' },
    { id: 'channels', label: 'Channels', icon: 'ph-chats-circle', desc: '채널 공통 설정' }
];

function closeAllDropdowns(e) {
    if (!e.target.closest('#workspace-selector-container')) {
        state.isWorkspaceDropdownOpen = false;
        const dd = document.getElementById('workspace-dropdown');
        if (dd) dd.classList.add('hidden');
    }
    if (!e.target.closest('#agent-menu-container')) {
        state.isAgentMenuOpen = false;
        const adm = document.getElementById('agent-menu-dropdown');
        if (adm) adm.classList.add('hidden');
    }
}
</script>

<!-- GNB -->
<header class="h-14 border-b border-sb-border bg-sb-surface flex items-center justify-between px-6 shrink-0 z-50 relative shadow-sm">
    <div class="flex items-center gap-6">
        <div class="flex items-center gap-2 cursor-pointer group" onclick="goToLobby()">
            <img src="logo.png" alt="delight.ai" class="w-7 h-7 group-hover:scale-110 transition-transform">
            <span class="font-bold text-lg tracking-tight text-sb-text">delight.ai</span>

    </div>
    <div class="flex items-center gap-4">
        <button onclick="openOrgSettings()" class="text-sb-muted hover:text-sb-text transition-colors p-1.5 rounded-md hover:bg-sb-hover" title="Organization Settings">
            <i class="ph ph-gear text-xl"></i>
        </button>
        <div onclick="openOrgSettingsAt('profile')" class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 cursor-pointer border border-sb-border ml-2 flex items-center justify-center text-white text-xs font-bold" title="치호">치호</div>
    </div>
</header>

<!-- Main container -->
<div class="flex-1 flex overflow-hidden relative">

    <!-- VIEW: LOBBY -->

        <div class="max-w-5xl w-full">
            <div class="mb-8 flex items-end justify-between">
                <div>
                    <h1 class="text-3xl font-bold mb-2 tracking-tight text-sb-text">Workspaces</h1>
                    <p class="text-sb-muted">작업을 시작할 워크스페이스를 선택하거나 새로 생성하세요.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openModal('add-agent')" class="inline-flex items-center gap-2 bg-white border border-sb-border text-sb-text font-semibold rounded-md px-4 py-2 hover:bg-sb-hover transition-colors text-sm">
                        <i class="ph ph-plus"></i> New Agent
                    </button>
                    <button onclick="openModal('add-workspace')" class="inline-flex items-center gap-2 bg-sb-primary text-white font-semibold rounded-md px-4 py-2 hover:bg-sb-primary/90 transition-colors text-sm">
                        <i class="ph ph-plus"></i> New Workspace
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="lobby-workspaces"></div>
        </div>
    </div>

    <!-- VIEW: DASHBOARD SHELL (Sidebar + Main) -->
    <div id="view-dashboard" class="flex-1 flex h-full hidden w-full">
        <aside class="w-64 border-r border-sb-border bg-sb-surface flex flex-col shrink-0 z-20 shadow-[2px_0_10px_rgba(0,0,0,0.02)] relative">
            <div class="px-3 pt-3 pb-1 relative" id="workspace-selector-container">
                <button onclick="toggleWorkspaceDropdown(event)" class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-sb-hover transition-colors">
                    <div id="ws-avatar" class="w-7 h-7 rounded-md bg-sb-primary text-white text-xs font-bold flex items-center justify-center shrink-0">W</div>
                    <span id="current-ws-name" class="text-sm font-bold text-sb-text flex-1 truncate text-left">Workspace</span>
                    <i class="ph ph-caret-down text-sb-muted text-sm shrink-0"></i>
                </button>
                <div id="workspace-dropdown" class="hidden absolute top-full left-3 right-3 mt-1 bg-sb-surface border border-sb-border rounded-lg shadow-lg z-50 overflow-hidden">
                    <div class="max-h-60 overflow-y-auto p-1" id="workspace-dropdown-list"></div>
                    <div class="p-1 border-t border-sb-border bg-sb-base/50">
                        <button onclick="openModal('add-workspace')" class="w-full flex items-center gap-2 text-sm font-semibold text-sb-text px-3 py-2 rounded-md hover:bg-sb-hover hover:text-sb-primaryDark transition-colors">
                            <i class="ph ph-plus text-sb-muted"></i> Create Workspace
                        </button>
                    </div>
                </div>
            </div>

            <div class="px-2 pt-1 pb-2">
                <button id="all-agents-btn" onclick="goToWorkspaceHub()" class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors text-sb-muted hover:bg-sb-hover hover:text-sb-text">
                    <i class="ph ph-squares-four text-lg shrink-0"></i>
                    <span class="truncate flex-1 text-left">All Agents</span>
                    <span id="all-agents-count" class="text-[10px] font-semibold shrink-0 text-slate-400">0</span>
                </button>
            </div>

            <div class="mx-3 border-t border-sb-border"></div>

            <div class="flex-1 overflow-y-auto pt-3 pb-3">
                <div class="px-5 mb-1.5">
                    <label class="text-[11px] font-bold text-sb-muted uppercase tracking-wider">Agents</label>
                </div>
                <ul id="agent-nav-list" class="space-y-0.5 px-2"></ul>
            </div>

            <div class="px-3 py-3 border-t border-sb-border bg-sb-surface z-10">
                <button onclick="openWsSettings()" class="flex items-center gap-2 text-sm text-sb-muted hover:text-sb-text w-full px-3 py-2 rounded-md hover:bg-sb-hover transition-colors font-medium">
                    <i class="ph ph-sliders-horizontal text-lg"></i> Workspace Settings
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-sb-base overflow-hidden relative z-10" id="main-area"></main>
    </div>

    <!-- VIEW: ORG SETTINGS (full-screen overlay) -->
    <div id="view-org-settings" class="hidden absolute inset-0 bg-sb-base z-40 flex flex-col">
        <div class="border-b border-sb-border bg-sb-surface px-6 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="closeSettings()" class="flex items-center gap-1.5 text-sb-muted hover:text-sb-text text-sm font-medium px-2 py-1 rounded-md hover:bg-sb-hover transition-colors">
                    <i class="ph ph-arrow-left"></i> Back
                </button>
                <div class="h-4 w-px bg-sb-border"></div>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-sb-text">Organization Settings</span>
                    <span class="text-sb-muted text-sm">· Sendbird Inc.</span>
                </div>
            </div>
        </div>
        <div class="flex-1 flex overflow-hidden">
            <aside class="w-64 border-r border-sb-border bg-sb-surface p-4 overflow-y-auto">
                <div id="org-settings-menu-list"></div>
            </aside>
            <div class="flex-1 overflow-y-auto p-8" id="org-settings-content"></div>
        </div>
    </div>

    <!-- VIEW: WS SETTINGS (full-screen overlay) -->
    <div id="view-ws-settings" class="hidden absolute inset-0 bg-sb-base z-40 flex flex-col">
        <div class="border-b border-sb-border bg-sb-surface px-6 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <button onclick="closeSettings()" class="flex items-center gap-1.5 text-sb-muted hover:text-sb-text text-sm font-medium px-2 py-1 rounded-md hover:bg-sb-hover transition-colors">
                    <i class="ph ph-arrow-left"></i> Back
                </button>
                <div class="h-4 w-px bg-sb-border"></div>
                <div class="flex items-center gap-2">
                    <div id="ws-settings-avatar" class="w-5 h-5 rounded bg-sb-primary text-white text-[9px] font-bold flex items-center justify-center">W</div>
                    <span class="font-bold text-sb-text">Workspace Settings</span>
                    <span class="text-sb-muted text-sm" id="ws-settings-title">· Workspace</span>
                </div>
            </div>
        </div>
        <div class="flex-1 flex overflow-hidden">
            <aside class="w-64 border-r border-sb-border bg-sb-surface p-4 overflow-y-auto">
                <label class="text-[11px] font-bold text-sb-muted uppercase tracking-wider mb-3 block px-2">Settings</label>
                <ul class="space-y-1" id="ws-settings-menu-list"></ul>
            </aside>
            <div class="flex-1 overflow-y-auto p-8" id="ws-settings-content"></div>
        </div>
    </div>
</div>

<!-- Modal backdrop -->
<div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-900/40 z-[60] flex items-center justify-center p-4" onclick="closeModalFromBackdrop(event)">
    <div id="modal-card" class="bg-sb-surface rounded-lg shadow-2xl border border-sb-border w-full max-w-md modal-enter" onclick="event.stopPropagation()"></div>
</div>

<script>
function init() { renderLobby(); updateView(); }

function goToLobby() {
    state.view = 'lobby';
    state.currentWorkspaceId = null;
    state.currentAgentId = null;
    updateView();
}

function goToWorkspaceHub(wsId) {
    if (wsId) state.currentWorkspaceId = wsId;
    state.view = 'workspace-hub';
    state.currentAgentId = null;
    updateView();
}

function enterWorkspace(wsId) { goToWorkspaceHub(wsId); }

function enterAgentDirectly(wsId, agentId) {
    state.currentWorkspaceId = wsId;
    state.currentAgentId = agentId;
    state.view = 'agent-dashboard';
    updateView();
}

function openOrgSettings() {
    state.previousView = state.view;
    state.view = 'org-settings';
    updateView();
}

function openOrgSettingsAt(menuId) {
    state.orgSettingsMenu = menuId;
    openOrgSettings();
}

function openWsSettings() {
    if (!state.currentWorkspaceId) {
        state.currentWorkspaceId = state.workspaces[0].id;
    }
    state.previousView = state.view;
    state.view = 'ws-settings';
    updateView();
}

function openWsSettingsAt(menuId) {
    state.wsSettingsMenu = menuId;
    openWsSettings();
}

function closeSettings() {
    state.view = state.previousView || (state.currentWorkspaceId ? 'workspace-hub' : 'lobby');
    state.previousView = null;
    updateView();
}

function updateView() {
    const lobby = document.getElementById('view-lobby');
    const dashboard = document.getElementById('view-dashboard');
    const orgSettings = document.getElementById('view-org-settings');
    const wsSettings = document.getElementById('view-ws-settings');

    lobby.classList.add('hidden');
    dashboard.classList.add('hidden');
    orgSettings.classList.add('hidden');
    wsSettings.classList.add('hidden');

    if (state.view === 'lobby') {
        lobby.classList.remove('hidden');
    } else if (state.view === 'org-settings') {
        orgSettings.classList.remove('hidden');
        renderOrgSettings();
    } else if (state.view === 'ws-settings') {
        wsSettings.classList.remove('hidden');
        renderWsSettings();
    } else {
        dashboard.classList.remove('hidden');
        renderDashboard();
    }
}

function renderLobby() {
    const container = document.getElementById('lobby-workspaces');
    container.innerHTML = state.workspaces.map(ws => {
        const MAX = 3;
        const display = ws.agents.slice(0, MAX);
        const hidden = ws.agents.length - MAX;
        return `
        <div class="bg-sb-surface border border-sb-border rounded-lg p-0 hover:border-sb-muted/40 transition-colors flex flex-col overflow-hidden h-[250px]">
            <div onclick="enterWorkspace('${ws.id}')" class="p-5 border-b border-sb-border bg-sb-base cursor-pointer group flex items-center justify-between shrink-0">
                <div>
                    <h3 class="text-lg font-bold text-sb-text group-hover:text-sb-primaryDark transition-colors flex items-center gap-2">
                        <div class="w-7 h-7 rounded-md bg-sb-primary text-white text-xs font-bold flex items-center justify-center shrink-0">${ws.name.charAt(0).toUpperCase()}</div>
                        ${ws.name}
                    </h3>
                    <p class="text-xs text-sb-muted mt-1 font-medium pl-9">${ws.agents.length} Agents</p>
                </div>
                <div class="w-8 h-8 rounded bg-sb-surface border border-sb-border flex items-center justify-center text-sb-muted group-hover:text-sb-primaryDark group-hover:border-sb-primary/30 transition-all">
                    <i class="ph ph-arrow-right"></i>
                </div>
            </div>
            <div class="p-3 flex-1 bg-sb-surface flex flex-col">
                ${ws.agents.length === 0 ? `
                    <div class="flex-1 flex flex-col items-center justify-center text-center py-6 text-sb-muted">
                        <i class="ph ph-robot text-3xl text-slate-300 mb-2"></i>
                        <div class="text-xs font-medium">No agents yet</div>
                    </div>
                ` : `
                    <ul class="space-y-1 flex-1">
                        ${display.map(a => `
                            <li>
                                <button onclick="event.stopPropagation(); enterAgentDirectly('${ws.id}', '${a.id}')" class="w-full text-left px-3 py-2 rounded-md text-sm font-medium text-sb-text hover:bg-sb-hover hover:text-sb-primaryDark transition-colors flex items-center gap-3 border border-transparent hover:border-sb-border group">
                                    <div class="relative shrink-0">
                                        <div class="w-6 h-6 rounded bg-sb-hover flex items-center justify-center text-sb-muted"><i class="ph-fill ph-robot text-base"></i></div>
                                        <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full ${getAgentStage(a).dotColor} ring-2 ring-sb-surface"></span>
                                    </div>
                                    <span class="truncate flex-1">${a.name}</span>
                                    <span class="text-[11px] text-slate-400 font-normal group-hover:text-sb-primary transition-colors">${a.time}</span>
                                </button>
                            </li>
                        `).join('')}
                    </ul>
                `}
            </div>
        </div>`;
    }).join('');
}

function renderDashboard() {
    if (!state.currentWorkspaceId) return;
    renderWorkspaceDropdown();
    renderSidebar();
    renderMainArea();
}

function renderMainArea() {
    const mainArea = document.getElementById('main-area');
    if (state.view === 'workspace-hub') {
        mainArea.innerHTML = buildWorkspaceHubHTML();
    } else if (state.view === 'agent-dashboard') {
        mainArea.innerHTML = buildAgentDashboardShellHTML();
        renderMainHeader();
        renderContent();
    }
}

function buildWorkspaceHubHTML() {
    const ws = state.workspaces.find(w => w.id === state.currentWorkspaceId);
    if (!ws) return '';

    const agentCards = ws.agents.map(a => {
        const stage = getAgentStage(a);
        return `
        <button onclick="enterAgentDirectly('${ws.id}', '${a.id}')" class="text-left bg-sb-surface border border-sb-border rounded-lg p-4 hover:border-sb-muted/40 transition-colors group">
            <div class="flex items-start justify-between mb-3">
                <div class="w-10 h-10 rounded-lg bg-sb-hover flex items-center justify-center text-sb-muted">
                    <i class="ph-fill ph-robot text-xl"></i>
                </div>
                <span class="inline-flex items-center gap-1.5 rounded-md border px-2 py-0.5 text-[11px] font-semibold ${stage.classes}">
                    <span class="w-1.5 h-1.5 rounded-full ${stage.dotColor}"></span>
                    ${stage.label}
                </span>
            </div>
            <div class="font-bold text-sb-text mb-1 truncate group-hover:text-sb-primaryDark">${a.name}</div>
            <div class="text-xs text-sb-muted">Edited ${a.time}</div>
        </button>`;
    }).join('');

    return `
    <div class="flex-1 overflow-y-auto">
        <div class="bg-sb-surface border-b border-sb-border px-8 py-8">
            <div class="max-w-6xl flex items-center gap-5">
                <div class="w-16 h-16 rounded-lg bg-sb-primary flex items-center justify-center text-white text-3xl font-bold shadow-sm shrink-0">${ws.name.charAt(0).toUpperCase()}</div>
                <div class="flex-1">
                    <h1 class="text-2xl font-bold text-sb-text tracking-tight">${ws.name}</h1>

function toggleWorkspaceDropdown(e) {
    e.stopPropagation();
    state.isWorkspaceDropdownOpen = !state.isWorkspaceDropdownOpen;
    renderWorkspaceDropdown();
}

function changeWorkspaceFromDropdown(wsId) {
    state.isWorkspaceDropdownOpen = false;
    changeWorkspace(wsId);
}

function renderWorkspaceDropdown() {
    const currentWs = state.workspaces.find(w => w.id === state.currentWorkspaceId);
    const nameEl = document.getElementById('current-ws-name');
    if (currentWs && nameEl) nameEl.innerText = currentWs.name;
    const dropdown = document.getElementById('workspace-dropdown');
    const listContainer = document.getElementById('workspace-dropdown-list');
    if (!dropdown || !listContainer) return;

    if (state.isWorkspaceDropdownOpen) {
        dropdown.classList.remove('hidden');
        dropdown.classList.add('dropdown-enter');
        listContainer.innerHTML = state.workspaces.map(ws => {
            const isSelected = ws.id === state.currentWorkspaceId;
            return `<button onclick="changeWorkspaceFromDropdown('${ws.id}')" class="w-full flex items-center justify-between gap-2 px-3 py-2 text-sm rounded-md transition-colors ${isSelected ? 'bg-sb-hover font-bold text-sb-primaryDark' : 'text-sb-text font-medium hover:bg-sb-hover'}"><span class="flex items-center gap-2 truncate flex-1 min-w-0"><div class="w-5 h-5 rounded bg-sb-primary text-white text-[9px] font-bold flex items-center justify-center shrink-0">${ws.name.charAt(0).toUpperCase()}</div><span class="truncate">${ws.name}</span></span><span class="flex items-center gap-2 shrink-0"><span class="text-[10px] font-semibold ${isSelected ? 'text-sb-primary/80' : 'text-slate-400'}">${ws.agents.length}</span>${isSelected ? '<i class="ph ph-check text-sb-primary"></i>' : ''}</span></button>`;
        }).join('');
    } else {
        dropdown.classList.add('hidden');
        dropdown.classList.remove('dropdown-enter');
    }
}

function renderSidebar() {
    const currentWs = state.workspaces.find(w => w.id === state.currentWorkspaceId);
    if (!currentWs) return;

    const avatar = document.getElementById('ws-avatar');
    if (avatar) avatar.innerText = currentWs.name.charAt(0).toUpperCase();

    const isHub = state.view === 'workspace-hub';
    const allAgentsBtn = document.getElementById('all-agents-btn');
    if (allAgentsBtn) {
        allAgentsBtn.className = `w-full flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors ${isHub ? 'bg-sb-primary/10 text-sb-primaryDark' : 'text-sb-muted hover:bg-sb-hover hover:text-sb-text'}`;
        const icon = allAgentsBtn.querySelector('i');
        if (icon) icon.className = `${isHub ? 'ph-fill text-sb-primary' : 'ph'} ph-squares-four text-lg shrink-0`;
    }
    const countEl = document.getElementById('all-agents-count');
    if (countEl) {
        countEl.innerText = currentWs.agents.length;
        countEl.className = `text-[10px] font-semibold shrink-0 ${isHub ? 'text-sb-primary/80' : 'text-slate-400'}`;
    }

    const list = document.getElementById('agent-nav-list');
    if (!list) return;
    list.innerHTML = currentWs.agents.map(agent => {
        const isActive = agent.id === state.currentAgentId && state.view === 'agent-dashboard';
        const stage = getAgentStage(agent);
        return `<li><button onclick="changeAgent('${agent.id}')" class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors group ${isActive ? 'bg-sb-primary/10 text-sb-primaryDark' : 'text-sb-muted hover:bg-sb-hover hover:text-sb-text'}"><span class="relative shrink-0"><i class="${isActive ? 'ph-fill text-sb-primary' : 'ph'} ph-robot text-lg"></i><span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full ${stage.dotColor} ring-2 ring-sb-surface"></span></span><span class="truncate flex-1 text-left">${agent.name}</span><span class="text-[10px] whitespace-nowrap shrink-0 ${isActive ? 'text-sb-primary/80' : 'text-slate-400 opacity-0 group-hover:opacity-100 transition-opacity'}">${agent.time}</span></button></li>`;
    }).join('');
}

function getAgentStage(agent) {
    if (agent.envStatus.production) return { label: 'Prod', classes: 'bg-green-50 text-green-700 border-green-200', dotColor: 'bg-green-500' };
    if (agent.envStatus.staging)    return { label: 'Staging', classes: 'bg-amber-50 text-amber-800 border-amber-200', dotColor: 'bg-amber-500' };
    if (agent.envStatus.dev)        return { label: 'Dev', classes: 'bg-slate-100 text-slate-600 border-slate-300', dotColor: 'bg-slate-400' };
    return { label: 'New', classes: 'bg-slate-50 text-slate-400 border-slate-200', dotColor: 'bg-slate-300' };
}

function renderWsSettings() {
    const ws = state.workspaces.find(w => w.id === state.currentWorkspaceId);

    const titleEl = document.getElementById('ws-settings-title');
    if (titleEl) titleEl.innerText = '· ' + ws.name;
    const avatarEl = document.getElementById('ws-settings-avatar');
    if (avatarEl) avatarEl.innerText = ws.name.charAt(0).toUpperCase();

    const list = document.getElementById('ws-settings-menu-list');
    list.innerHTML = wsSettingsMenus.map(m => {
        const isActive = m.id === state.wsSettingsMenu;
        return `<li><button onclick="selectWsSettingsMenu('${m.id}')" class="w-full flex items-center gap-2 px-3 py-2 rounded-md text-sm font-medium transition-colors text-left ${isActive ? 'bg-sb-primary/10 text-sb-primaryDark' : 'text-sb-muted hover:bg-sb-hover hover:text-sb-text'}"><i class="${isActive ? 'ph-fill' : 'ph'} ${m.icon} text-lg"></i>${m.label}</button></li>`;

// --- AGENT CONTEXT MENU ---
function toggleAgentMenu(e) {
    e.stopPropagation();
    state.isAgentMenuOpen = !state.isAgentMenuOpen;
    const dd = document.getElementById('agent-menu-dropdown');
    if (!dd) return;
    if (state.isAgentMenuOpen) dd.classList.remove('hidden');
    else dd.classList.add('hidden');
}

function closeAgentMenu() {
    state.isAgentMenuOpen = false;
    const dd = document.getElementById('agent-menu-dropdown');
    if (dd) dd.classList.add('hidden');
}

function openArchiveAgentModal() {
    closeAgentMenu();
    openModal('archive-agent');
}

function openDeleteAgentModal() {
    closeAgentMenu();
    openModal('delete-agent');
}

function updateDeleteConfirmState(value) {
    const ws = state.workspaces.find(w => w.id === state.currentWorkspaceId);
    const agent = ws && ws.agents.find(a => a.id === state.currentAgentId);
    const btn = document.getElementById('delete-confirm-btn');
    if (btn && agent) {
        btn.disabled = value !== agent.name;
    }
}

function openArchiveWorkspaceModal() { openModal('archive-workspace'); }
function openDeleteWorkspaceModal() { openModal('delete-workspace'); }

function updateDeleteWorkspaceConfirmState(value) {
    const ws = state.workspaces.find(w => w.id === state.currentWorkspaceId);
    const btn = document.getElementById('delete-ws-confirm-btn');
    if (btn && ws) {
        btn.disabled = value !== ws.name;
    }
}

// --- MODALS ---
function openModal(type) {
    state.modal = type;
    const backdrop = document.getElementById('modal-backdrop');
    const card = document.getElementById('modal-card');
    backdrop.classList.remove('hidden');
    card.innerHTML = buildModalHTML(type);
}

function closeModal() {
    state.modal = null;
    document.getElementById('modal-backdrop').classList.add('hidden');
}

}

        const agent = ws && ws.agents.find(a => a.id === state.currentAgentId);
        if (!agent) return '';
        const isLive = !!agent.envStatus.production;
        return `
        <div class="p-6 border-b border-sb-border">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-red-50 flex items-center justify-center text-red-600">
                    <i class="ph-fill ph-warning-octagon text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-sb-text">Delete "${agent.name}"?</h2>
            </div>
            <p class="text-sb-muted text-sm">영구 삭제됩니다. <strong class="text-red-600">이 작업은 되돌릴 수 없습니다.</strong></p>
        </div>
        <div class="p-6 space-y-3">
            <div class="bg-red-50 border border-red-200 rounded-lg p-3 flex items-start gap-2.5 text-xs">
                <i class="ph-fill ph-x-circle text-red-600 text-base mt-0.5 shrink-0"></i>
                <div class="text-red-900 leading-relaxed">
                    <div class="font-bold mb-1">삭제되는 항목</div>
                    <ul class="space-y-0.5">
                        <li>• 모든 환경의 버전 기록 (Dev/Staging/Prod)</li>
                        <li>• 대화 로그 전체</li>
                        <li>• Golden Set, 평가 기록</li>
                        <li>• Build 설정 및 Shared Assets 연결</li>
                    </ul>
                </div>
            </div>
            ${isLive ? `
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 flex items-start gap-2.5 text-xs">
                    <i class="ph-fill ph-warning-circle text-amber-600 text-base mt-0.5 shrink-0"></i>
                    <div class="text-amber-900 leading-relaxed">
                        <div class="font-bold mb-1">⚠ Production 라이브 중</div>
                        실제 유저 대화가 즉시 중단됩니다. <button onclick="closeModal(); openArchiveAgentModal();" class="underline font-semibold hover:text-amber-700">Archive 먼저</button> 하는 것을 권장합니다.
                    </div>
                </div>
            ` : ''}
            <div>
                <label class="text-xs font-bold text-sb-muted uppercase tracking-wider mb-2 block">확인을 위해 Agent 이름을 입력하세요</label>
                <div class="text-xs font-mono text-sb-text bg-slate-50 border border-sb-border px-3 py-1.5 rounded mb-2 select-all">${agent.name}</div>
                <input type="text" id="delete-confirm-input" oninput="updateDeleteConfirmState(this.value)" placeholder="Agent 이름 입력" class="w-full px-3 py-2 border border-sb-border rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-red-500 focus:border-red-500" autocomplete="off">
            </div>
        </div>
        <div class="p-4 border-t border-sb-border bg-sb-base/50 flex items-center justify-end gap-2 rounded-b-xl">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-sb-muted hover:text-sb-text rounded-md hover:bg-sb-hover transition-colors">Cancel</button>
            <button id="delete-confirm-btn" onclick="closeModal()" disabled class="px-4 py-2 text-sm font-semibold bg-red-600 text-white rounded-md hover:bg-red-700 transition-colors flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed disabled:bg-red-400">
                <i class="ph ph-trash font-bold"></i> Permanently Delete
            </button>
        </div>`;
    } else if (type === 'add-agent') {
        const showWsSelector = !state.currentWorkspaceId;
        const wsOptions = state.workspaces.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
        return `
        <div class="p-6 border-b border-sb-border">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 rounded-lg bg-sb-hover flex items-center justify-center text-sb-muted">
                    <i class="ph-fill ph-robot text-xl"></i>
                </div>
                <h2 class="text-lg font-bold text-sb-text">Create AI Agent</h2>
            </div>
            <p class="text-sb-muted text-sm">Development 환경에서 시작하여 단계별로 배포됩니다.</p>
        </div>
        <div class="p-6 space-y-4">
            ${showWsSelector ? `
                <div>
                    <label class="text-xs font-bold text-sb-muted uppercase tracking-wider mb-2 block">Target Workspace</label>
                    <div class="relative">
                        <select class="w-full appearance-none px-3 py-2 pr-8 border border-sb-border rounded-md text-sm bg-white focus:outline-none focus:ring-1 focus:ring-sb-primary focus:border-sb-primary">
                            ${wsOptions}
                        </select>
                        <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-sb-muted pointer-events-none"></i>
                    </div>
                </div>
            ` : ''}
            <div>
                <label class="text-xs font-bold text-sb-muted uppercase tracking-wider mb-2 block">Agent Name</label>
                <input type="text" placeholder="e.g. Refund Helper" class="w-full px-3 py-2 border border-sb-border rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-sb-primary focus:border-sb-primary">
            </div>
            <div>
                <label class="text-xs font-bold text-sb-muted uppercase tracking-wider mb-2 block">Template</label>
                <div class="grid grid-cols-3 gap-2">
                    ${[
                        {label: 'Blank', icon: 'ph-plus-square', active: true},
                        {label: 'Support', icon: 'ph-lifebuoy', active: false},
                        {label: 'Sales', icon: 'ph-shopping-bag', active: false}
                    ].map(t => `
                        <button class="p-3 rounded-lg border transition-all flex flex-col items-center gap-1 ${t.active ? 'border-sb-primary bg-sb-primary/5 text-sb-primary' : 'border-sb-border text-sb-muted hover:border-sb-primary/40 hover:bg-sb-hover'}">
                            <i class="ph-fill ${t.icon} text-xl"></i>
                            <span class="text-xs font-semibold">${t.label}</span>
                        </button>
                    `).join('')}
                </div>
            </div>
            <div class="bg-slate-50 border border-sb-border rounded-lg p-3 flex items-start gap-2.5 text-xs text-sb-muted">
                <i class="ph-fill ph-info text-sb-primary text-base mt-0.5 shrink-0"></i>
                <span>생성 즉시 <strong class="text-sb-text">Development</strong> 환경에 배포됩니다. Staging/Production 승격은 Build 완료 후 Publish 버튼으로 진행하세요.</span>
            </div>
        </div>
        <div class="p-4 border-t border-sb-border bg-sb-base/50 flex items-center justify-end gap-2 rounded-b-xl">
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-sb-muted hover:text-sb-text rounded-md hover:bg-sb-hover transition-colors">Cancel</button>
            <button onclick="closeModal()" class="px-4 py-2 text-sm font-semibold bg-sb-text text-white rounded-md hover:bg-sb-primary/90 transition-colors flex items-center gap-1.5">
                <i class="ph ph-plus font-bold"></i> Create Agent
            </button>
        </div>`;
    }
    return '';
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (state.modal) closeModal();
        else if (state.view === 'org-settings' || state.view === 'ws-settings') closeSettings();
    }
});

init();
</script>

</body>
</html>
